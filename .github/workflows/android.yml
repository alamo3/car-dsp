name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_B64 != '' && secrets.SIGNING_PASSWORD != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Before any APK exists: a broken matcher, ranker or API client stops the release.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          COMPANION_CODE=$((1000 + $(git rev-list --count HEAD -- companion)))
          echo "COMPANION_CODE=$COMPANION_CODE" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease \
            -PcabinVersionCode=$VERSION_CODE -PcabinVersionName=$VERSION_NAME -PcompanionVersionCode=$COMPANION_CODE
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/cabineq-v$VERSION_NAME.apk"
          cp companion/build/outputs/apk/release/companion-release.apk "out/cabineq-youtube-c$COMPANION_CODE.apk"

      # Google Play takes an app bundle, not an APK. Same key: it becomes the Play upload key.
      - name: Build signed release bundle (Google Play)
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:bundleRelease \
            -PcabinVersionCode=$VERSION_CODE -PcabinVersionName=$VERSION_NAME
          cp app/build/outputs/bundle/release/app-release.aab "out/cabineq-v$VERSION_NAME.aab"

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets not set - building debug APK, no release."
          ./gradlew --no-daemon assembleDebug \
            -PcabinVersionCode=$VERSION_CODE -PcabinVersionName=$VERSION_NAME
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/cabineq-v$VERSION_NAME-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabineq-apk
          path: out/*.apk

      - name: Upload Play bundle artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cabineq-play-bundle
          path: out/*.aab

      - name: Publish GitHub release
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" out/cabineq-v$VERSION_NAME.apk out/cabineq-youtube-c$COMPANION_CODE.apk \
            --target "$GITHUB_SHA" \
            --title "CabinEQ $VERSION_NAME" \
            --generate-notes

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      # Pushes to main also go to Google Play's internal testing track, so the phone and the car
      # get the same build through the store. Needs the PLAY_SERVICE_ACCOUNT_JSON secret; without
      # it this step is skipped and the GitHub release still works as before.
      - name: Upload to Google Play (internal testing)
        if: env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.alamo3.cabineq
          releaseFiles: out/cabineq-v${{ env.VERSION_NAME }}.aab
          track: internal
          status: completed

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
