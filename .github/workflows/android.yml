name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_B64 != '' && secrets.SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PcabinVersionCode=$VERSION_CODE -PcabinVersionName=$VERSION_NAME
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/cabineq-v$VERSION_NAME.apk"

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets not set - building debug APK, no release."
          ./gradlew --no-daemon assembleDebug \
            -PcabinVersionCode=$VERSION_CODE -PcabinVersionName=$VERSION_NAME
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/cabineq-v$VERSION_NAME-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabineq-apk
          path: out/*.apk

      - name: Publish GitHub release
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" out/cabineq-v$VERSION_NAME.apk \
            --target "$GITHUB_SHA" \
            --title "CabinEQ $VERSION_NAME" \
            --generate-notes

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
